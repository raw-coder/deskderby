<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desk Derby · Play me</title>
<meta name="description" content="You've been invited to a Desk Derby match.">
<meta property="og:title" content="Play me in Desk Derby">
<meta property="og:description" content="Tabletop soccer on your desk. Tap to join my room.">
<style>
  :root { --cream: #faf2e0; --ink: #211c1a; --coral: #ee5c4d; --felt: #3d6b3a; --brass: #dba852; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cream: #2a2420; --ink: #faf2e0; } }
  :root[data-theme="dark"] { --cream: #2a2420; --ink: #faf2e0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: radial-gradient(ellipse at top, #4a7a45, var(--felt) 70%); font-family: ui-rounded, -apple-system, system-ui, sans-serif; }
  .card { width: min(420px, 100%); background: var(--cream); color: var(--ink); border-radius: 28px; padding: 28px 22px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  h1 { margin: 0 0 6px; font-size: 30px; font-weight: 900; }
  p { margin: 0 0 18px; opacity: .75; font-weight: 600; line-height: 1.4; }
  .code { display: flex; justify-content: center; gap: 6px; margin: 0 0 22px; }
  .code span { width: 40px; height: 50px; display: grid; place-items: center; border-radius: 10px; background: rgba(127,127,127,.15); font-size: 26px; font-weight: 900; }
  a.btn { display: block; padding: 15px; border-radius: 999px; font-weight: 800; font-size: 18px; text-decoration: none; margin-top: 10px; }
  .primary { background: var(--coral); color: #fff; }
  .secondary { background: rgba(127,127,127,.15); color: var(--ink); }
  .bar { width: 64px; height: 6px; border-radius: 3px; background: var(--brass); margin: 0 auto 16px; }
</style>
</head>
<body>
<main class="card">
  <h1>Play me in Desk Derby</h1>
  <div class="bar"></div>
  <p>Your friend is waiting in a private room. Open the game to join.</p>
  <div class="code" id="code" aria-label="Room code"></div>
  <a class="btn primary" id="open" href="#">Open Desk Derby</a>
  <a class="btn secondary" href="https://apps.apple.com/app/id6833439569">Get it on the App Store</a>
</main>
<script>
  // Only letters and digits ever reach the app link.
  var raw = new URLSearchParams(location.search).get("c") || "";
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  var box = document.getElementById("code");
  code.split("").forEach(function (ch) { var s = document.createElement("span"); s.textContent = ch; box.appendChild(s); });
  var link = "deskderby://join?c=" + code;
  document.getElementById("open").href = link;
  if (code.length >= 4) { setTimeout(function () { location.href = link; }, 300); }
</script>
</body>
</html>
